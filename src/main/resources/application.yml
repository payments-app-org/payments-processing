server:
  port: 8085

spring:
  application:
    name: processing
  threads:
    virtual:
      enabled: true
  # Redis: итоги переводов (идемпотентность) — переживают рестарт, одни на все поды
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis недоступен — отказ за секунды (кэш идёт мимо, readiness — DOWN), а не ожидание по минуте
      connect-timeout: 1s
      timeout: 2s
      repositories:
        enabled: false

# Доли исходов; остальное — COMPLETED
processing:
  decline-rate: ${PROCESSING_DECLINE_RATE:0.07}
  timeout-rate: ${PROCESSING_TIMEOUT_RATE:0.03}
  slow-delay: 5s
  # Сколько хранить итог перевода (повтор и запрос статуса)
  results-ttl: 7d
  # Ручная проверка: копейки .88 — отказ, .99 — долгий ответ
  declined-kopecks: 88
  slow-kopecks: 99

# Actuator: /actuator/health — liveness (процесс жив) и readiness (готов принимать запросы: есть БД и Redis);
# по ним healthcheck в compose и пробы Kubernetes. Остановка — плавная (по умолчанию в Spring Boot): новые запросы
# не принимаем, текущие дорабатывают
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis

# Общая библиотека libs/platform
platform:
  # Swagger: описание API и коды ошибок в схеме Problem
  openapi:
    description: "Заглушка процессинга: переводы, справочник СБП, перечисления фондам"

springdoc:
  # Swagger UI и спецификация включены; в проде можно выключить: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
