server:
  port: 8085

spring:
  application:
    name: processing
  # HTTP-клиент к payment: итоги долгих переводов и входящие СБП
  http:
    serviceclient:
      payment:
        base-url: ${PAYMENT_URL:http://localhost:8083}
        connect-timeout: 1s
        read-timeout: 5s
  threads:
    virtual:
      enabled: true
  # Redis: итоги переводов (идемпотентность) — переживают рестарт, одни на все поды
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis недоступен — отказ за секунды (кэш идёт мимо, readiness — DOWN), а не ожидание по минуте
      connect-timeout: 1s
      timeout: 2s
      repositories:
        enabled: false

# Доли исходов; остальное — COMPLETED
processing:
  decline-rate: ${PROCESSING_DECLINE_RATE:0.07}
  timeout-rate: ${PROCESSING_TIMEOUT_RATE:0.03}
  slow-delay: 5s
  # Сколько хранить итог перевода (повтор и запрос статуса)
  results-ttl: 7d
  # Ручная проверка: копейки .88 — отказ, .99 — долгий ответ
  declined-kopecks: 88
  slow-kopecks: 99
  # Долгие переводы: за рубеж и пополнение из другого банка по СБП (там клиент подтверждает списание).
  # Отвечаем IN_PROGRESS, итог — через delay-min…delay-max уведомлением в payment
  async:
    types: [ABROAD]
    sbp-pull: true
    delay-min: ${PROCESSING_ASYNC_DELAY_MIN:20s}
    delay-max: ${PROCESSING_ASYNC_DELAY_MAX:40s}
    poll-interval: 2s
    batch-size: 50
    notify-attempts: 5
    notify-retry-delay: 10s

# Actuator: /actuator/health — liveness (процесс жив) и readiness (готов принимать запросы: есть БД и Redis);
# по ним healthcheck в compose и пробы Kubernetes. Остановка — плавная (по умолчанию в Spring Boot): новые запросы
# не принимаем, текущие дорабатывают
management:
  endpoints:
    web:
      exposure:
        # prometheus — метрики для Prometheus (/actuator/prometheus); куда отправлять трассы и формат логов
        # задаёт окружение (в Kubernetes — payments-deploy/envs/<окружение>/env.yaml)
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis

# Общая библиотека libs/platform
platform:
  # Swagger: описание API и коды ошибок в схеме Problem
  openapi:
    description: "Заглушка процессинга: переводы (в том числе долгие), справочник СБП, входящие СБП, перечисления фондам"

springdoc:
  # Swagger UI и спецификация включены; в проде можно выключить: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
